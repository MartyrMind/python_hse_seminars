[project]
name = "ami-python-seminars"
version = "0.1.0"
description = "Seminar tasks for the HSE Applied Mathematics and Informatics Python course"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8",
]
lint = [
  "ruff>=0.6",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
